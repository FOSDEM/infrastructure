sources:
  background:
    type: image
    path: images/background.png
  camera:
    type: v4l
    path: /dev/v4l/by-path/pci-0000:00:14.0-usbv3-0:1:1.0-video-index0
    # path: /dev/video0
    fmt: yuyv
    frames:
      width: 1920
      height: 1080
      # width: 640
      # height: 480
      num_allocated_frames: 6
    num_frames_in_writing: 3
    fps: 30
  slides:
    type: v4l
    path: /dev/v4l/by-path/pci-0000:00:14.0-usbv3-0:3:1.0-video-index0
    fmt: yuyv
    frames:
      width: 1920
      height: 1080
      num_allocated_frames: 6
    num_frames_in_writing: 3
    fps: 30

