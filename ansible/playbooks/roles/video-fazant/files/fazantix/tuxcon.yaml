scenes:
  cam-over-slides:
    layers:
      - source: background
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1
      - source: slides
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1
        warp:
          opacity: 0
          cx: 0.5
          cy: 0.5
          scale: 0.1
      - source: camera
        transform:
          right: 0
          bottom: 0
          scale: 0.25
          opacity: 1
#        warp:
#          right: 0
#          bottom: 0
#          scale: 0.25
#          opacity: 1
  full-slides:
    layers:
      - source: background
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1
      - source: slides
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1
  full-cam:
    layers:
      - source: background
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1
      - source: camera
        transform:
          x: 0
          y: 0
          scale: 1
          opacity: 1

sinks:
  projector:
    type: window
    frames:
      width: 1920
      height: 1080
    default_scene: cam-over-slides
    transition_time_ms: 1
  stream:
    type: ffmpeg_stdin
    #cmd: "ffmpeg -f rawvideo -video_size 1280x720 -pixel_format rgba -framerate 30 -i - -c:v libx264 -preset fast -pix_fmt yuv420p -f mpegts - | /usr/bin/sproxy"
    cmd: "/opt/fazantix/sink.sh"
    frames:
      width: 1920
      height: 1080
      num_allocated_frames: 5
    default_scene: cam-over-slides
    transition_time_ms: 1

api:
  bind: ':8000'
  enable_profiler: true

fallback_colour: '#ebac54'
bg_colour: '#54aceb'
base_framerate: 30
