---

- name: create edid directory
  file:
    path: "/usr/lib/firmware/edid"
    state: directory
    mode: 0755

- name: install edid file config
  copy:
    src: hwtweaks/EDID.bin
    dest: /usr/lib/firmware/edid/EDID.bin
    owner: root
    group: root
    mode: 0644
  notify: update initramfs

- name: install GRUB cqe config
  copy:
    src: hwtweaks/10-sdhci.cfg
    dest: /etc/default/grub.d/10-sdhci.cfg
    owner: root
    group: root
    mode: 0755
  notify: update grub

- name: install GRUB edid config
  copy:
    src: hwtweaks/20-fosdem-edid.cfg
    dest: /etc/default/grub.d/20-fosdem-edid.cfg
    owner: root
    group: root
    mode: 0755
  notify: update grub

