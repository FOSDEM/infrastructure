---
- name: install video-status script
  copy:
    src: video-status/video-status.py
    dest: /usr/local/bin/video-status.py
    owner: root
    group: root
    mode: 0755
  register: videostatusscript

- name: install rp2040 proxy
  copy:
    src: video-status/rp2040_proxy.py
    dest: /usr/local/bin/rp2040_proxy.py
    owner: root
    group: root
    mode: 0755
  register: proxyscript

- name: install video-preview script
  copy:
    src: video-status/preview.sh
    dest: /usr/local/bin/preview.sh
    owner: root
    group: root
    mode: 0755

- name: install video-status service
  copy:
    src: video-status/video-status.service
    dest: /etc/systemd/system/video-status.service
    owner: root
    group: root
    mode: 0644
  register: videostatus

- name: install rp2040 proxy service
  copy:
    src: video-status/rp2040-proxy.service
    dest: /etc/systemd/system/rp2040-proxy.service
    owner: root
    group: root
    mode: 0644
  register: videostatus

- name: install video-preview service
  copy:
    src: video-status/video-preview.service
    dest: /etc/systemd/system/video-preview.service
    owner: root
    group: root
    mode: 0644


- name: disable getty on tty1
  service:
    name: getty@tty1.service
    enabled: false
    state: stopped

- name: enable rp2040 proxy service
  service:
    name: rp2040-proxy
    enabled: true
    state: started

- name: enable video-status service
  service:
    name: video-status
    enabled: true
    state: started

- name: restart video-status service
  service:
    name: video-status
    state: restarted

- name: enable video-preview service
  service:
    name: video-preview
    enabled: true
    state: started

